[project]
name = "hayai-ocr"
authors = [
    {name = "NopeNopeGuy"},
]
description = "Fast OCR for Japanese manga (fork of manga-ocr)"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dynamic = ["version"]
dependencies = [
    "fire",
    "jaconv",
    "loguru",
    "numpy",
    "Pillow>=10.0.0",
    "pyperclip",
    "torch>=1.0",
    "transformers>=4.45.0",
    "torchvision",
    "torchao",
    "fugashi",
    "unidic_lite",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/NopeNopeGuy/hayai-ocr"
Repository = "https://github.com/NopeNopeGuy/hayai-ocr"
Issues = "https://github.com/NopeNopeGuy/hayai-ocr/issues"

[build-system]
requires = ["setuptools >= 61.0.0", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hayai_ocr"]

[tool.setuptools.package-data]
hayai_ocr = ["assets/*"]

[tool.setuptools.dynamic]
version = {attr = "hayai_ocr._version.__version__"}

[tool.ruff]
line-length = 120
indent-width = 4

[project.scripts]
hayai_ocr = "hayai_ocr.__main__:main"
